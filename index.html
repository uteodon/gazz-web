<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gazz+ — Direksiyonda yazılan hikayeler...</title>
<meta name="description" content="Gazz+ ile aracını takip et, modifiyelerini kaydet, topluluğa katıl. Her km yeni bir sayfa.">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0B0B0D;
    color: #F2F2F0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    background-image:
      radial-gradient(circle at 50% 0%, rgba(200, 23, 8, 0.12), transparent 60%);
  }

  .logo {
    font-size: 56px;
    font-weight: 900;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  .logo .ga { color: #C81708; }
  .logo .zz { color: #F2F2F0; }
  .logo .plus { color: #C81708; }

  .slogan {
    font-size: 17px;
    color: #A8A8A5;
    margin-bottom: 4px;
  }
  .slogan-sub {
    font-size: 13px;
    color: #6E6E6B;
    margin-bottom: 40px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .cta {
    display: inline-block;
    background: #C81708;
    color: #FFFFFF;
    text-decoration: none;
    font-weight: 700;
    font-size: 15px;
    padding: 14px 32px;
    border-radius: 10px;
    letter-spacing: 0.3px;
    transition: opacity 0.2s ease;
  }
  .cta:hover { opacity: 0.88; }

  .stripe {
    width: 64px;
    height: 3px;
    background: #C81708;
    margin: 32px 0;
    border-radius: 2px;
  }

  footer {
    margin-top: 48px;
    font-size: 12px;
    color: #4A4A48;
  }
  footer a {
    color: #6E6E6B;
    text-decoration: none;
  }
  footer a:hover { color: #A8A8A5; }
</style>
</head>
<body>

  <div class="logo"><span class="ga">GA</span><span class="zz">ZZ</span><span class="plus">+</span></div>
  <div class="slogan">Direksiyonda yazılan hikayeler...</div>
  <div class="slogan-sub">Her km yeni bir sayfa.</div>

  <a class="cta" href="#">Uygulamayı İndir</a>

  <div class="stripe"></div>

  <footer>
    &copy; 2026 Gazz+ &nbsp;·&nbsp;
    <a href="/gizlilik-politikasi.html">Gizlilik Politikası</a>
  </footer>

</body>
</html>
