<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gazz — E-posta Doğrulandı</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0d0d0d;
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    color: #f2f0ea;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  .card {
    max-width: 420px;
  }
  .check {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: #C81708;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 24px;
    font-size: 32px;
  }
  h1 {
    font-size: 24px;
    margin: 0 0 12px;
  }
  p {
    color: #8a8a85;
    font-size: 15px;
    line-height: 1.5;
    margin: 0;
  }
  .brand {
    margin-top: 40px;
    font-size: 13px;
    letter-spacing: 2px;
    color: #4a4a46;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>
    <h1>E-postan doğrulandı</h1>
    <p>Bu sekmeyi kapatıp Gazz uygulamasına dönebilirsin. Uygulamada "Doğruladım, giriş yap" butonuna basman yeterli.</p>
    <div class="brand">GAZZ</div>
  </div>
</body>
</html>
